spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# In production, require explicit JWT secret, no default fallback
jwt.secret=${JWT_SECRET}

# Production security headers and CORS would be managed in code/infrastructure
# Disable trace/debug logging
logging.level.root=WARN
logging.level.com.example.supermarket=INFO
logging.level.org.springframework.security=WARN

# Do not show SQL in prod
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Flyway should validate but not necessarily wipe data
spring.flyway.enabled=true
spring.jpa.hibernate.ddl-auto=validate
