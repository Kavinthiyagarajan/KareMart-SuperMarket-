spring.application.name=supermarket-backend
spring.datasource.url=${DB_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:supermarket}}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Connection Pool (HikariCP)
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:10}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:2}
spring.datasource.hikari.idle-timeout=${DB_POOL_IDLE_TIMEOUT:300000}
spring.datasource.hikari.connection-timeout=${DB_POOL_CONN_TIMEOUT:20000}
spring.datasource.hikari.max-lifetime=${DB_POOL_MAX_LIFETIME:1200000}

spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${FORMAT_SQL:false}
springdoc.swagger-ui.path=/swagger-ui.html
server.port=${SERVER_PORT:${PORT:8080}}

server.error.include-stacktrace=${SERVER_ERROR_INCLUDE_STACKTRACE:never}
server.error.include-message=${SERVER_ERROR_INCLUDE_MESSAGE:never}

cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}

payment.provider=${PAYMENT_PROVIDER:mock}
delivery.provider=${DELIVERY_PROVIDER:mock}
razorpay.key-id=${RAZORPAY_KEY_ID:}
razorpay.key-secret=${RAZORPAY_KEY_SECRET:}
jwt.secret=${JWT_SECRET:super_secret_key_super_secret_key_super_secret_key}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

app.seed.admin-enabled=${INITIAL_ADMIN_SEED:true}
app.seed.admin-username=${INITIAL_ADMIN_USERNAME:admin}
app.seed.admin-password=${INITIAL_ADMIN_PASSWORD:password}

