spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# In production, require explicit JWT secret, no default fallback
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Production CORS restriction
cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

# Logging and Error Handling
logging.level.root=WARN
logging.level.com.example.supermarket=INFO
logging.level.org.springframework.security=WARN

server.error.include-stacktrace=never
server.error.include-message=never

# Do not show SQL in prod
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Flyway should validate but not necessarily wipe data
spring.flyway.enabled=true
spring.jpa.hibernate.ddl-auto=validate

